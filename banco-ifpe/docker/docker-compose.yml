services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_banco_ifpe
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_banco_ifpe}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  builder:
    image: maven:3.9.6-eclipse-temurin-17
    container_name: builder_banco_ifpe
    working_dir: /app
    volumes:
      - ../:/app
      - maven_cache:/root/.m2
    command: mvn clean package

  wildfly:
    build: ./wildfly
    container_name: wildfly_banco_ifpe
    ports:
      - "8080:8080"
      - "9990:9990"
    volumes:
      - ../target/banco-ifpe.war:/opt/jboss/wildfly/standalone/deployments/banco-ifpe.war
      - wildfly_xml_history:/opt/jboss/wildfly/standalone/configuration/standalone_xml_history
    depends_on:
      postgres:
        condition: service_healthy
      builder:
        condition: service_completed_successfully

volumes:
  maven_cache:
  wildfly_xml_history:
