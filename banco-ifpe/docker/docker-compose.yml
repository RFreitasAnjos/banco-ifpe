services:
  postgres:
    image: postgres:16-alpine
    container_name: db_banco_ifpe
    environment:
      POSTGRES_DB: banco_ifpe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  wildfly:
    image: quay.io/wildfly/wildfly:34.0.1.Final-jdk17
    container_name: wildfly_banco_ifpe
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ../target/banco-ifpe.war:/opt/jboss/wildfly/standalone/deployments/banco-ifpe.war:ro
